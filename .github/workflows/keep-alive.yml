name: Render sitesini uyanik tut

# Düzensiz dakikalarda, 7 saatlik döngüyle ping:
# 00:07 -> 07:19 -> 14:33 -> 21:46 -> (ertesi gün 00:07)
on:
  schedule:
    - cron: "7 0 * * *"
    - cron: "19 7 * * *"
    - cron: "33 14 * * *"
    - cron: "46 21 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping kitap-seslendir
        run: |
          curl -fsS -A "KitapSeslendir-KeepAlive/1.0" \
            "https://kitap-seslendir.onrender.com/" \
            -o /dev/null -w "HTTP %{http_code}\n"
