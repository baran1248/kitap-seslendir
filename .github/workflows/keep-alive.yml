name: Render sitesini uyanik tut

# Ucretsiz GitHub Actions zamanlayicisi: Render ücretsiz katmani 15 dk
# bosta kalinca sunucuyu uyutuyor. Her 5 dakikada bir siteye istek atariz.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping kitap-seslendir
        run: |
          curl -fsS -A "KitapSeslendir-KeepAlive/1.0" \
            "https://kitap-seslendir.onrender.com/" \
            -o /dev/null -w "HTTP %{http_code}\n"
