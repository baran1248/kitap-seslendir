name: Render sitesini uyanik tut

# 7 saatlik dongu: her saat icin farkli duzensiz dakika kalibi.
# Kalip 7 saatte bir tekrarlanir (saat mod 7):
#   0,7,14,21 -> P0    1,8,15,22 -> P1    2,9,16,23 -> P2    3,10,17 -> P3
#   4,11,18 -> P4      5,12,19 -> P5      6,13,20 -> P6
# Boylece 7 saat boyunca daginik ping atilir, sonra ayni kalip yeniden baslar.
on:
  schedule:
    - cron: "3,11,18,26,34,42,49,57 0,7,14,21 * * *"
    - cron: "5,13,20,28,36,44,51,59 1,8,15,22 * * *"
    - cron: "2,9,17,24,32,40,47,55 2,9,16,23 * * *"
    - cron: "6,14,21,29,37,45,52,58 3,10,17 * * *"
    - cron: "1,8,16,23,31,39,46,54 4,11,18 * * *"
    - cron: "4,12,19,27,35,43,50,56 5,12,19 * * *"
    - cron: "7,15,22,30,38,46,53,59 6,13,20 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping kitap-seslendir
        run: |
          curl -fsS -A "KitapSeslendir-KeepAlive/1.0" \
            "https://kitap-seslendir.onrender.com/" \
            -o /dev/null -w "HTTP %{http_code}\n"
