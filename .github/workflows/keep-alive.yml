name: Render sitesini uyanik tut

# Düzensiz dakika kalıbı, saat başı değil 7 saatte bir tekrarlanır:
# 00:03,00:11,...,00:57 -> 07:03,... -> 14:03,... -> 21:03,...
on:
  schedule:
    - cron: "3,11,18,26,34,42,49,57 */7 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping kitap-seslendir
        run: |
          curl -fsS -A "KitapSeslendir-KeepAlive/1.0" \
            "https://kitap-seslendir.onrender.com/" \
            -o /dev/null -w "HTTP %{http_code}\n"
