name: Render sitesini uyanik tut

# 5 dakikada bir tetiklenir, 0-5 dk arasinda rastgele bekler, sonra ping atar.
# Boylece ping araliklari 5-10 dakika arasinda degisir ve surekli devam eder.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping kitap-seslendir
        run: |
          BEKLEME=$((RANDOM % 300))   # 0-299 saniye (0-5 dakika)
          echo "Rastgele bekleme: ${BEKLEME} sn"
          sleep "$BEKLEME"
          curl -fsS -A "KitapSeslendir-KeepAlive/1.0" \
            "https://kitap-seslendir.onrender.com/" \
            -o /dev/null -w "HTTP %{http_code}\n"
